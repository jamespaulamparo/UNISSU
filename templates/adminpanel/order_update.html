{% extends 'adminpanel/base.html' %}

{% block title %}Update Order #{{ order.id }}{% endblock %}

{% block content %}
<div class="page-header">
    <h1>Update Order #{{ order.id }}</h1>
    <a href="{% url 'adminpanel:order_detail' order.id %}" class="btn btn-secondary">&larr; View Order</a>
    <a href="{% url 'adminpanel:orders_list' %}" class="btn btn-secondary">All Orders</a>
</div>

<div class="order-update-form">
    <form method="post">
        {% csrf_token %}
        <div class="form-grid">
            <div class="form-group">
                <label>Customer Name:</label>
                <input type="text" name="customer_name" value="{{ order.customer_name }}" required>
            </div>
            <div class="form-group">
                <label>Email:</label>
                <input type="email" name="email" value="{{ order.email }}" required>
            </div>
            <div class="form-group">
                <label>Phone:</label>
                <input type="text" name="phone" value="{{ order.phone|default_if_none:'' }}">
            </div>
            <div class="form-group full-width">
                <label>Address:</label>
                <textarea name="address" rows="3" required>{{ order.address }}</textarea>
            </div>
            <div class="form-group">
                <label>Total Amount:</label>
                <input type="number" name="total_amount" step="0.01" value="{{ order.total_amount }}" required>
            </div>
            <div class="form-group">
                <label>Status:</label>
                <select name="status" class="status-select">
                    {% for value, label in order.STATUS_CHOICES %}
                    <option value="{{ value }}" {% if order.status == value %}selected{% endif %}>{{ label }}</option>
                    {% endfor %}
                </select>
            </div>
        </div>
        <div class="form-actions">
            <button type="submit" class="btn btn-primary">Update Order & Notify Customer</button>
            <a href="{% url 'adminpanel:order_detail' order.id %}" class="btn btn-secondary">Cancel</a>
        </div>
    </form>
</div>

<style>
.page-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 20px;
    flex-wrap: wrap;
    gap: 10px;
}
.form-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
    gap: 20px;
    margin-bottom: 20px;
}
.form-group {
    display: flex;
    flex-direction: column;
}
.form-group.full-width {
    grid-column: 1 / -1;
}
.form-group label {
    font-weight: 500;
    margin-bottom: 5px;
    color: #333;
}
.form-group input, .form-group textarea, .form-group select {
    padding: 10px;
    border: 1px solid #ddd;
    border-radius: 4px;
    font-size: 1rem;
}
.status-select {
    min-width: 200px;
}
.form-actions {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
}
.btn {
    padding: 10px 20px;
    border-radius: 4px;
    text-decoration: none;
    font-size: 1rem;
    border: none;
    cursor: pointer;
}
.btn-primary {
    background-color: #007bff;
    color: white;
}
.btn-primary:hover {
    background-color: #0056b3;
}
.btn-secondary {
    background-color: #6c757d;
    color: white;
}
.btn-secondary:hover {
    background-color: #545b62;
}
</style>
{% endblock %}
