
{% extends 'base.html' %}

{% block content %}
<h2>Update Order</h2>
<form method="POST">
    {% csrf_token %}
    <label for="customer_name">Customer Name:</label>
    <input type="text" id="customer_name" name="customer_name" value="{{ order.customer_name }}" required>

    <label for="email">Email:</label>
    <input type="email" id="email" name="email" value="{{ order.email }}" required>

    <label for="address">Address:</label>
    <textarea id="address" name="address" required>{{ order.address }}</textarea>

    <label for="product_id">Product ID:</label>
    <input type="number" id="product_id" name="product_id" value="{{ order.product_id }}" required>

    <label for="quantity">Quantity:</label>
    <input type="number" id="quantity" name="quantity" value="{{ order.quantity }}" min="1" required>

    <button type="submit">Update Order</button>
</form>
<link rel="stylesheet" type="text/css" href="{% static 'css/order_management.css' %}">
<script src="{% static 'js/order_management.js' %}"></script>
{% endblock %}
